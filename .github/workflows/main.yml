name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas con cobertura
        run: npm run test:coverage
  
  docker:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/api-inventario:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/api-inventario:${{ github.sha }}
  deploy:
    name: Desplegar en EC2
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configurar llave SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Desplegar contenedor en la EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="$DOCKERHUB_USERNAME/api-inventario:$GITHUB_SHA"
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" bash -s <<EOF
          set -e
          for i in 1 2 3; do
            docker pull $IMAGE && break
            sleep 10
          done
          docker image inspect $IMAGE > /dev/null
          docker stop api-inventario || true
          docker rm api-inventario || true
          docker run -d --name api-inventario --restart unless-stopped -p 80:80 -p 6061:6061 $IMAGE
          docker image prune -f
          EOF

      - name: Verificar el despliegue
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "http://$EC2_HOST/api/health"; then
              echo
              exit 0
            fi
            sleep 10
          done
          echo "La API no respondio tras el despliegue"
          exit 1